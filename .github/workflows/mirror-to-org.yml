# Copies every change on master in daskals/lab-instrument-control to the
# lab organisation's copy of the repository.
#
# Needs a repository secret ORG_MIRROR_DEPLOY_KEY: the private half of an SSH
# key whose public half is a write-enabled deploy key on the organisation repo.
# The push is not forced, so commits made directly in the organisation copy
# make this job fail instead of being overwritten.

name: Mirror to lab organisation

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: mirror-to-org

jobs:
  mirror:
    # the workflow file is copied to the organisation repo too; do nothing there
    if: github.repository == 'daskals/lab-instrument-control'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push master and tags to the organisation repository
        env:
          DEPLOY_KEY: ${{ secrets.ORG_MIRROR_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes"
          TARGET=git@github.com:Microwave-Antenna-Engineering-Group-HWU/lab-instrument-control.git
          git push "$TARGET" HEAD:refs/heads/master
          git push "$TARGET" --tags
